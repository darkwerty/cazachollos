[tool.poetry]
name = "cazachollos"
version = "0.1.0"
description = "Ofertas de grupos de Telegram convertidas en datos que se pueden buscar"
authors = ["Daniel Alonso García <hola@danielalonso.dev>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = {version = "^2.0.25", extras = ["asyncio"]}
asyncpg = "^0.29.0"
alembic = "^1.13.1"
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
telethon = "^1.33.1"
streamlit = "^1.30.0"
altair = "^5.2.0"
pandas = "^2.2.0"
psycopg2-binary = "^2.9.9" # sync driver for the Streamlit dashboard
python-dotenv = "^1.0.0"
price-parser = "^0.3.4"
google-genai = "^1.0"
openai = "^1.50"
azure-identity = "^1.17"
httpx = ">=0.27"
beautifulsoup4 = "^4.12"
fastapi = ">=0.115"
uvicorn = ">=0.30"
jinja2 = "^3.1"
google-auth = "^2.30"
requests = "^2.31"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.0"
mypy = "^1.8.0"
pytest = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
